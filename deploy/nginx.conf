map $http_accept $commune_federation_request {
    default 0;
    ~*application/(activity\+json|ld\+json) 1;
}

# Serve the frontend and API under one HTTPS authority so authenticated
# cookies, Origin checks, and CSRF remain valid.
server {
    listen 443 ssl http2;
    server_name forum.example;

    ssl_certificate /etc/letsencrypt/live/forum.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forum.example/privkey.pem;

    root /srv/commune/frontend/current;
    index index.html;

    # Hashed interface catalogs are immutable, but a missing hash must never
    # receive the SPA document because the client checks the JSON content type.
    location ^~ /assets/i18n/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /api/ {
        proxy_pass http://commune_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # These backend paths are public protocol and media entry points, not SPA routes.
    location ~ ^/(users|inbox|objects|activities|contexts|federation-media|collections|health|\.well-known)(/|$) {
        proxy_pass http://commune_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # /communities/:id is both an Elm page and an ActivityPub Group resource.
    # Content negotiation selects the backend only for federation media types.
    location ^~ /communities/ {
        if ($commune_federation_request) {
            return 418;
        }
        try_files $uri /index.html;
    }

    error_page 418 = @commune_federation;
    location @commune_federation {
        proxy_pass http://commune_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
    }
}

upstream commune_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}
